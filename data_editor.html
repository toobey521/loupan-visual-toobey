<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房源数据管理-Toobey · 天河·壹号</title>
<style>
    @font-face {
        font-family: 'MaShanZheng';
        src: url('fonts/MaShanZheng-Regular.ttf') format('truetype');
        font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background:
            linear-gradient(rgba(0, 200, 255, 0.045) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 200, 255, 0.045) 1px, transparent 1px),
            linear-gradient(160deg, #080c1a 0%, #0d1730 50%, #091226 100%);
        background-size: 44px 44px, 44px 44px, 100% 100%;
        color: #dfe3f2;
        min-height: 100vh;
    }
    .header {
        background: radial-gradient(ellipse 70% 60% at 50% -30%, rgba(0, 200, 255, 0.22) 0%, transparent 60%), linear-gradient(135deg, #101c3c 0%, #16245c 50%, #1a1040 100%);
        padding: 18px 16px;
        text-align: center;
        border-bottom: 1px solid rgba(0, 200, 255, 0.25);
        position: sticky; top: 0; z-index: 100;
    }
    .header h1 {
        font-size: 24px;
        font-family: 'MaShanZheng', 'STKaiti', '楷体', serif;
        font-weight: 400;
        letter-spacing: 4px;
        background: linear-gradient(180deg, #fff8e6 0%, #ffd77a 45%, #c8933a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 14px rgba(255, 200, 80, 0.4));
    }
    .header .sub { font-size: 12px; color: #7c87ad; margin-top: 6px; }
    .back-home {
        position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
        color: #9fd8ff; text-decoration: none; font-size: 13px;
        border: 1px solid rgba(0, 200, 255, 0.4); padding: 7px 14px; border-radius: 2px;
        background: rgba(0, 200, 255, 0.08);
        clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        transition: all 0.2s;
    }
    .back-home:hover { background: rgba(0, 200, 255, 0.2); box-shadow: 0 0 12px rgba(0, 200, 255, 0.35); }

    .toolbar {
        max-width: 1400px; margin: 16px auto 0; padding: 0 16px;
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .toolbar .stat {
        background: rgba(0, 200, 255, 0.07);
        border: 1px solid rgba(0, 200, 255, 0.25);
        padding: 7px 14px; border-radius: 2px; font-size: 13px; color: #9fb4dd;
        clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    }
    .toolbar .stat b { font-size: 15px; text-shadow: 0 0 10px currentColor; }
    .toolbar .stat:nth-child(1) b { color: #7fd8ff; }
    .toolbar .stat:nth-child(2) b { color: #ff5d7a; }
    .toolbar .stat:nth-child(3) b { color: #ffb347; }
    .toolbar .stat:nth-child(4) b { color: #8a93b8; }
    .toolbar select, .toolbar input[type="search"] {
        background: rgba(8, 16, 36, 0.9);
        border: 1px solid rgba(0, 200, 255, 0.4);
        color: #dfe8ff; font-size: 13px; padding: 8px 12px; border-radius: 2px; outline: none;
    }
    .toolbar select:focus, .toolbar input:focus { border-color: #00c8ff; box-shadow: 0 0 12px rgba(0, 200, 255, 0.3); }
    .btn {
        padding: 9px 18px; border-radius: 2px; border: none; cursor: pointer;
        font-size: 13px; font-weight: 600; transition: all 0.25s; white-space: nowrap;
        clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    }
    .btn-primary { background: linear-gradient(135deg, #00a8e8, #7b68ee); color: #fff; }
    .btn-primary:hover { box-shadow: 0 0 18px rgba(0, 200, 255, 0.55); }
    .btn-warn { background: rgba(255, 93, 122, 0.15); border: 1px solid rgba(255, 93, 122, 0.5); color: #ff5d7a; }
    .btn-warn:hover { background: rgba(255, 93, 122, 0.3); }
    .btn-ghost { background: rgba(0, 200, 255, 0.1); border: 1px solid rgba(0, 200, 255, 0.4); color: #7fd8ff; }
    .btn-ghost:hover { background: rgba(0, 200, 255, 0.25); }

    .table-wrap {
        max-width: 1400px; margin: 14px auto 40px; padding: 0 16px;
        overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 1500px; }
    thead th {
        z-index: 10;
        background: rgba(16, 28, 56, 0.97);
        border: 1px solid rgba(0, 200, 255, 0.2);
        padding: 10px 6px; font-size: 12px; color: #7fd8ff; white-space: nowrap;
        text-align: center;
    }
    tbody td {
        border: 1px solid rgba(0, 200, 255, 0.08);
        padding: 4px 3px; text-align: center; vertical-align: middle;
    }
    tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    tbody tr:hover { background: rgba(0, 200, 255, 0.06); }
    tbody tr.sold { background: rgba(74, 222, 128, 0.06); }
    tbody tr.sub { background: rgba(251, 191, 36, 0.06); }
    tbody input[type="text"], tbody input[type="number"] {
        width: 100%; padding: 6px 4px;
        background: rgba(8, 16, 36, 0.8);
        border: 1px solid transparent; border-radius: 2px;
        color: #dfe8ff; font-size: 12px; text-align: center; outline: none;
        transition: all 0.2s;
    }
    tbody input:focus { border-color: rgba(0, 200, 255, 0.6); background: rgba(8, 16, 36, 1); }
    tbody select {
        width: 100%; padding: 6px 4px;
        background: rgba(8, 16, 36, 0.9);
        border: 1px solid rgba(0, 200, 255, 0.25); border-radius: 2px;
        color: #dfe8ff; font-size: 12px; text-align: center; outline: none; cursor: pointer;
    }
    .st { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .bname-cell { padding: 6px 4px; color: #9fd8ff; font-weight: 600; text-align: center; }
    .st-unsold { background: rgba(139, 147, 184, 0.2); color: #9aa3c0; }
    .st-sub { background: rgba(251, 191, 36, 0.18); color: #ffb347; }
    .st-sold { background: rgba(74, 222, 128, 0.18); color: #4ade80; }
    .del-btn {
        width: 26px; height: 26px; border-radius: 2px; border: 1px solid rgba(255, 93, 122, 0.5);
        background: transparent; color: #ff5d7a; cursor: pointer; font-size: 14px; line-height: 1;
        transition: all 0.2s;
    }
    .del-btn:hover { background: rgba(255, 93, 122, 0.3); }
    .toast {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: rgba(16, 28, 56, 0.95); border: 1px solid rgba(0, 200, 255, 0.5);
        color: #7fd8ff; padding: 12px 26px; border-radius: 8px; font-size: 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); display: none; z-index: 999;
    }
    .toast.show { display: block; animation: ddIn 0.25s ease; }
    @keyframes ddIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .tip { max-width: 1400px; margin: 0 auto 10px; padding: 0 16px; font-size: 11px; color: #5f6d96; }
    .tip b { color: #7fd8ff; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(8, 14, 32, 0.6); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(0, 200, 255, 0.45), rgba(123, 104, 238, 0.45)); border-radius: 4px; border: 1px solid rgba(0, 200, 255, 0.2); }
    ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, rgba(0, 200, 255, 0.8), rgba(123, 104, 238, 0.8)); }
    * { scrollbar-width: thin; scrollbar-color: rgba(0, 200, 255, 0.5) rgba(8, 14, 32, 0.6); }
</style>
</head>
<body>

<div class="header">
    <a href="sales_control_v2.html" class="back-home">← 返回销控</a>
    <h1>房源数据管理</h1>
    <div class="sub">天河·壹号 · 编辑数据后点击「保存」，销控页/3D 巡航将同步更新</div>
</div>

<div class="toolbar">
    <div class="stat">总 <b id="tTotal">0</b> 套</div>
    <div class="stat">已售 <b id="tSold">0</b> 套</div>
    <div class="stat">认购 <b id="tSub">0</b> 套</div>
    <div class="stat">待售 <b id="tUnsold">0</b> 套</div>
    <select id="fBd"><option value="">全部楼栋</option></select>
    <select id="fSt">
        <option value="">全部状态</option>
        <option value="sold">已网签</option>
        <option value="sub">认购</option>
        <option value="unsold">待售</option>
    </select>
    <input type="search" id="fQ" placeholder="搜索楼号/房号/客户" style="flex:1;min-width:160px">
    <button class="btn btn-primary" onclick="saveData()">💾 保存数据</button>
    <button class="btn btn-ghost" onclick="addRow()">＋ 新增房源</button>
    <button class="btn btn-ghost" onclick="exportJson()">⬇ 导出 JSON</button>
    <button class="btn btn-warn" onclick="resetData()">↺ 恢复默认</button>
</div>
<div class="tip">💡 单元格可直接编辑；状态列选择「已网签/认购/待售」；<b>保存后</b>打开销控页或 3D 巡航即为最新数据。同一浏览器下生效。</div>

<div class="table-wrap">
    <table id="grid">
        <thead>
            <tr>
                <th style="width:56px">楼号</th>
                <th style="width:70px">房号</th>
                <th style="width:76px">状态</th>
                <th style="width:80px">户型</th>
                <th style="width:60px">类型</th>
                <th style="width:70px">面积㎡</th>
                <th style="width:82px">单价(元/㎡)</th>
                <th style="width:90px">总价(元)</th>
                <th style="width:80px">认购客户</th>
                <th style="width:86px">网签日期</th>
                <th style="width:80px">客户</th>
                <th style="width:82px">成交单价</th>
                <th style="width:90px">成交总价</th>
                <th style="width:40px">删除</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<div class="toast" id="toast"></div>

<script src="data/units.js"></script>
<script>
    const SKEY = 'loupan_units_v1';
    let data = [];
    let rows = [];

    // 楼栋显示名映射（与销控页完全一致）
    function bname(b) {
        const m = { 'S3商铺#': 'S3', 'S4商铺#': 'S4', '13商铺#': '13商', '18商铺#': '18商', '19商铺#': '19商', '20商铺#': '20商' };
        return m[b] || String(b).replace('#', '');
    }

    function load() {
        // units.js 已自动优先 localStorage; 此处再兜底
        let saved = null;
        try { saved = localStorage.getItem(SKEY); } catch (e) {}
        data = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(window.UNITS));
        fillBuildingFilter();
        render();
    }

    function fillBuildingFilter() {
        const bds = [...new Set(data.map(d => d.building))].sort((a, b) =>
            (parseInt(a.replace(/[^0-9]/g, '')) || 999) - (parseInt(b.replace(/[^0-9]/g, '')) || 999));
        document.getElementById('fBd').innerHTML = '<option value="">全部楼栋</option>' +
            bds.map(b => `<option value="${b}">${bname(b)}</option>`).join('');
    }

    function getStatus(d) {
        if (d.signStatus === '已网签') return 'sold';
        if (d.customer && d.customer !== '-') return 'sub';
        return 'unsold';
    }
    const ST_TXT = { sold: '已网签', sub: '认购', unsold: '待售' };

    function render() {
        const fb = document.getElementById('fBd').value;
        const fs = document.getElementById('fSt').value;
        const fq = document.getElementById('fQ').value.trim().toLowerCase();
        const list = data.filter(d => {
            if (fb && d.building !== fb) return false;
            if (fs && getStatus(d) !== fs) return false;
            if (fq) {
                const hay = (d.building + ' ' + d.room + ' ' + d.customer).toLowerCase();
                if (!hay.includes(fq)) return false;
            }
            return true;
        });
        const tb = document.getElementById('tbody');
        tb.innerHTML = '';
        rows = [];
        list.forEach((d, i) => {
            const idx = data.indexOf(d);
            const st = getStatus(d);
            const tr = document.createElement('tr');
            tr.className = st;
            tr.innerHTML = `
                <td><div class="bname-cell">${esc(bname(d.building))}</div></td>
                <td><input type="text" value="${esc(String(d.room).replace(/^商/, ''))}" data-k="room"></td>
                <td><select data-k="status">
                    <option value="unsold" ${st === 'unsold' ? 'selected' : ''}>待售</option>
                    <option value="sub" ${st === 'sub' ? 'selected' : ''}>认购</option>
                    <option value="sold" ${st === 'sold' ? 'selected' : ''}>已网签</option>
                </select></td>
                <td><input type="text" value="${esc(d.layout)}" data-k="layout"></td>
                <td><input type="text" value="${esc(d.type)}" data-k="type"></td>
                <td><input type="number" step="0.01" value="${d.area}" data-k="area"></td>
                <td><input type="number" step="1" value="${d.price}" data-k="price"></td>
                <td><input type="number" step="1" value="${d.total}" data-k="total"></td>
                <td><input type="text" value="${esc(d.customer === '-' ? '' : d.customer)}" data-k="customer" placeholder="认购客户"></td>
                <td><input type="text" value="${esc(d.signDate || '')}" data-k="signDate" placeholder="2026-08-07"></td>
                <td><input type="text" value="${esc(d.customer === '-' ? '' : d.customer)}" data-k="customer2" placeholder="成交客户"></td>
                <td><input type="number" step="1" value="${d.dealPrice || ''}" data-k="dealPrice"></td>
                <td><input type="number" step="1" value="${d.dealTotal || ''}" data-k="dealTotal"></td>
                <td><button class="del-btn" title="删除">✕</button></td>
            `;
            // 绑定编辑事件
            tr.querySelectorAll('input[data-k]').forEach(inp => {
                inp.addEventListener('change', () => {
                    const k = inp.dataset.k;
                    const v = inp.value;
                    if (k === 'customer' || k === 'customer2') {
                        d.customer = v || '-';
                        tr.querySelectorAll('input[data-k="customer"], input[data-k="customer2"]').forEach(o => { if (o !== inp) o.value = v; });
                    } else if (k === 'area' || k === 'price' || k === 'total' || k === 'dealPrice' || k === 'dealTotal') {
                        d[k] = parseFloat(v) || 0;
                    } else {
                        d[k] = v;
                    }
                    refreshRowClass(tr, d);
                });
            });
            tr.querySelector('select[data-k="status"]').addEventListener('change', e => {
                const v = e.target.value;
                if (v === 'sold') { d.signStatus = '已网签'; if (!d.customer || d.customer === '-') d.customer = '客户'; }
                else if (v === 'sub') { d.signStatus = ''; if (!d.customer || d.customer === '-') d.customer = '认购客户'; }
                else { d.signStatus = ''; d.customer = '-'; }
                render();
            });
            tr.querySelector('.del-btn').addEventListener('click', () => {
                data.splice(idx, 1);
                render();
            });
            tb.appendChild(tr);
            rows.push({ tr, idx });
        });
        updateStats();
    }

    function refreshRowClass(tr, d) {
        const st = getStatus(d);
        tr.className = st;
    }

    function updateStats() {
        let sold = 0, sub = 0;
        data.forEach(d => {
            if (getStatus(d) === 'sold') sold++;
            else if (getStatus(d) === 'sub') sub++;
        });
        document.getElementById('tTotal').textContent = data.length;
        document.getElementById('tSold').textContent = sold;
        document.getElementById('tSub').textContent = sub;
        document.getElementById('tUnsold').textContent = data.length - sold - sub;
    }

    function saveData() {
        try {
            localStorage.setItem(SKEY, JSON.stringify(data));
            showToast(`✅ 已保存 ${data.length} 条数据！打开销控页/3D 巡航即为最新数据`);
        } catch (e) {
            showToast('❌ 保存失败: ' + e.message);
        }
    }

    function addRow() {
        data.push({ building: '1#', room: '0000', type: '住宅', layout: '188㎡', area: 186.84, price: 7850, total: 1466694, dealPrice: 0, dealTotal: 0, customer: '-', signDate: '', signStatus: '', invoiceStatus: '', receiveStatus: '', gift: '' });
        render();
        showToast('已新增一行，填写信息后保存');
    }

    function resetData() {
        if (!confirm('确定恢复默认数据？当前编辑的 localStorage 数据将被清除。')) return;
        try { localStorage.removeItem(SKEY); } catch (e) {}
        location.reload();
    }

    function exportJson() {
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'loupan_units.json';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2600);
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    document.getElementById('fBd').addEventListener('change', render);
    document.getElementById('fSt').addEventListener('change', render);
    document.getElementById('fQ').addEventListener('input', render);
    load();
</script>
</body>
</html>
