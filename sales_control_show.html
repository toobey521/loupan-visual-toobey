<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>襄河一号 · 销控图（对客展示）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #faf8f5 0%, #f0ebe2 100%);
            min-height: 100vh;
            color: #2c2c2c;
        }
        .topbar {
            background: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e8e0d0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #8b6f47;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #f5efe6; }
        .topbar .title {
            flex: 1;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #2c2c2c;
        }
        .header {
            background: linear-gradient(135deg, #8b6f47 0%, #6b5435 100%);
            padding: 22px 16px 18px;
            text-align: center;
            color: #fff;
        }
        .header h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; letter-spacing: 2px; }
        .header .sub { font-size: 12px; opacity: 0.85; letter-spacing: 1px; }
        .building-nav {
            padding: 14px 10px 8px;
            background: #fff;
            border-bottom: 1px solid #f0e8d8;
        }
        .building-scroll {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 5px 8px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .building-scroll::-webkit-scrollbar { display: none; }
        .building-btn {
            flex-shrink: 0;
            padding: 8px 14px;
            background: #f5efe6;
            border: 1px solid #e8dfd0;
            border-radius: 20px;
            color: #6b5435;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .building-btn.active {
            background: linear-gradient(135deg, #8b6f47 0%, #6b5435 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 3px 10px rgba(139, 111, 71, 0.3);
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 18px;
            padding: 12px 16px;
            margin: 12px 16px 0;
            background: #fff;
            border-radius: 12px;
            font-size: 12px;
            color: #6b5435;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 12px; height: 12px; border-radius: 4px; }
        .legend-dot.sold { background: #c62828; }
        .legend-dot.subscribed { background: #ef6c00; }
        .legend-dot.unsold { background: #d4cfc4; }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 14px 10px;
            background: #fff;
            margin: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .stat-item { text-align: center; }
        .stat-item .num { font-size: 22px; font-weight: 700; }
        .stat-item .label { font-size: 11px; color: #999; margin-top: 2px; }
        .num.sold { color: #c62828; }
        .num.subscribed { color: #ef6c00; }
        .num.unsold { color: #999; }
        .sales-grid {
            padding: 10px 14px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        .room-card {
            background: #fff;
            border-radius: 12px;
            padding: 12px 10px;
            text-align: center;
            border: 1.5px solid #f0e8d8;
            transition: all 0.2s;
            position: relative;
        }
        .room-card.sold {
            background: linear-gradient(180deg, #fef5f5 0%, #fff 100%);
            border-color: #c62828;
        }
        .room-card.subscribed {
            background: linear-gradient(180deg, #fff7ed 0%, #fff 100%);
            border-color: #ef6c00;
        }
        .room-card.unsold {
            background: #fafaf7;
            border-color: #ebe5d8;
        }
        .room-number {
            font-size: 17px;
            font-weight: 700;
            color: #2c2c2c;
            margin-bottom: 4px;
        }
        .room-card.sold .room-number { color: #c62828; }
        .room-card.subscribed .room-number { color: #ef6c00; }
        .room-info {
            font-size: 11px;
            color: #999;
            margin-bottom: 8px;
        }
        .room-price {
            font-size: 12px;
            color: #6b5435;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .room-price-sub { font-size: 9px; color: #bbb; margin-bottom: 8px; }
        .room-customer {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            margin-top: 4px;
        }
        .room-customer.sold {
            background: #c62828;
        }
        .room-customer.subscribed {
            background: #ef6c00;
        }
        .room-status-tag {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .room-status-tag.sold { background: #c62828; color: #fff; }
        .room-status-tag.subscribed { background: #ef6c00; color: #fff; }
        .room-status-tag.unsold { background: #ebe5d8; color: #999; }
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 11px;
        }
        @media (max-width: 380px) {
            .sales-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .room-card { padding: 10px 8px; }
            .room-number { font-size: 15px; }
        }
    </style>
</head>

veStatus": "", "gift": ""}];

        let currentBuilding = '1#';

        function getStatus(d) {
            if (d.signStatus === '已网签') return 'sold';
            if (d.customer && d.customer !== '-') return 'subscribed';
            return 'unsold';
        }

        function getStatusText(status) {
            if (status === 'sold') return '已售';
            if (status === 'subscribed') return '认购';
            return '在售';
        }

        function maskCustomer(name) {
            if (!name || name === '-') return null;
            return name.charAt(0);
        }

        function initBuildingNav() {
            const buildings = [...new Set(allData.map(d => d.building))];
            const sortKey = b => {
                const m = b.match(/^([^\d]*)(\d*)(.*)$/);
                const prefix = m[1] || '';
                const num = parseInt(m[2] || '0');
                const suffix = m[3] || '';
                // 商铺排最后
                if (prefix.includes('铺') || b.startsWith('S')) return 100000 + num * 100;
                return num * 1000 + (suffix ? 1 : 0);
            };
            const sorted = buildings.sort((a, b) => sortKey(a) - sortKey(b));
            const scroll = document.getElementById('buildingScroll');
            scroll.innerHTML = sorted.map(b =>
                `<button class="building-btn ${b === currentBuilding ? 'active' : ''}" onclick="selectBuilding('${b}')">${b}</button>`
            ).join('');
        }

        function selectBuilding(building) {
            currentBuilding = building;
            document.querySelectorAll('.building-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim() === building);
            });
            updateSalesGrid();
        }

        function updateSalesGrid() {
            const grid = document.getElementById('salesGrid');
            const filtered = allData
                .filter(d => d.building === currentBuilding)
                .sort((a, b) => {
                    const fa = parseInt(a.room.replace(/[^0-9]/g,'')) || 0;
                    const fb = parseInt(b.room.replace(/[^0-9]/g,'')) || 0;
                    return fb - fa;
                });

            let sold = 0, sub = 0, unsold = 0;
            filtered.forEach(d => {
                const st = getStatus(d);
                if (st === 'sold') sold++;
                else if (st === 'subscribed') sub++;
                else unsold++;
            });

            document.getElementById('currentTotal').textContent = filtered.length;
            document.getElementById('currentSigned').textContent = sold;
            document.getElementById('currentSub').textContent = sub;
            document.getElementById('currentUnsold').textContent = unsold;

            grid.innerHTML = filtered.map(d => {
                const status = getStatus(d);
                const statusText = getStatusText(status);
                const customerChar = maskCustomer(d.customer);
                const customerHtml = customerChar ?
                    `<div class="room-customer ${status}">${customerChar}</div>` : '';
                const unitPrice = (d.price || 0).toLocaleString();
                const layoutName = d.layout && d.layout !== '-㎡' ? d.layout : (d.type === '商铺' ? '商铺' : '住宅');

                return `<div class="room-card ${status}">
                    <div class="room-status-tag ${status}">${statusText}</div>
                    <div class="room-number">${d.room}</div>
                    <div class="room-info">${layoutName} · ${(d.area || 0).toFixed(1)}㎡</div>
                    <div class="room-price">${unitPrice} 元/㎡</div>
                    <div class="room-price-sub">参考总价 ${(d.total || 0).toLocaleString()} 元</div>
                    ${customerHtml}
                </div>`;
            }).join('');
        }

        // URL 参数支持（从总平图直接进入指定楼栋）
        (function() {
            const params = new URLSearchParams(window.location.search);
            const b = params.get('b');
            if (b) {
                // 检查该楼栋是否存在
                const exists = allData.some(d => d.building === b);
                if (exists) {
                    selectBuilding(b);
                }
            }
        })();

        initBuildingNav();
        updateSalesGrid();
    </script>
