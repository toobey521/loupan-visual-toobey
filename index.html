<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>楼盘可视化-Toobey · 演示楼盘:天河·壹号</title>
    <style>
        @font-face {
            font-family: 'MaShanZheng';
            src: url('fonts/MaShanZheng-Regular.ttf') format('truetype');
            font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background:
                linear-gradient(rgba(0, 200, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 200, 255, 0.045) 1px, transparent 1px),
                linear-gradient(160deg, #080c1a 0%, #0d1730 50%, #091226 100%);
            background-size: 44px 44px, 44px 44px, 100% 100%;
            color: #dfe3f2;
            min-height: 100vh;
        }
        .hero {
            background:
                radial-gradient(ellipse 80% 60% at 50% -20%, rgba(0, 200, 255, 0.25) 0%, transparent 60%),
                linear-gradient(135deg, #101c3c 0%, #16245c 50%, #1a1040 100%);
            color: #fff;
            padding: 50px 20px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(0, 200, 255, 0.25);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .hero::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, #00c8ff, #7b68ee, #00c8ff, transparent);
            animation: heroLine 3.5s linear infinite;
        }
        @keyframes heroLine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .hero .brand {
            font-size: 12px;
            letter-spacing: 4px;
            opacity: 0.75;
            margin-bottom: 12px;
            color: #7fd8ff;
        }
        .hero h1 {
            font-size: 56px;
            font-weight: 400;
            letter-spacing: 10px;
            margin-bottom: 8px;
            font-family: 'MaShanZheng', 'STKaiti', '楷体', serif;
            background: linear-gradient(180deg, #fff8e6 0%, #ffd77a 45%, #c8933a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px rgba(255, 200, 80, 0.45)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
            animation: heroFloat 4s ease-in-out infinite;
        }
        @keyframes heroFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .hero .tag {
            display: inline-block;
            background: rgba(0, 200, 255, 0.12);
            border: 1px solid rgba(0, 200, 255, 0.4);
            color: #7fd8ff;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }
        .hero .sub {
            font-size: 13px;
            opacity: 0.85;
            letter-spacing: 1px;
            color: #ffd77a;
        }
        .section {
            padding: 28px 16px;
            max-width: 900px;
            margin: 0 auto;
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #e8ecff;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 200, 255, 0.2);
            text-shadow: 0 0 12px rgba(0, 200, 255, 0.35);
        }
        .section-title::before {
            content: '';
            display: block;
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, #00c8ff, #7b68ee);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(0, 200, 255, 0.6);
        }
        .section-sub {
            font-size: 12px;
            color: #7c87ad;
            margin-bottom: 16px;
        }

        /* 总平图 */
        .plan-img-wrap {
            background: rgba(16, 28, 56, 0.75);
            border: 1px solid rgba(0, 200, 255, 0.2);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 24px rgba(0, 200, 255, 0.08);
            margin-bottom: 16px;
            position: relative;
            backdrop-filter: blur(8px);
        }
        .plan-img-wrap::before {
            /* 热点定位参照：与图片同区域（padding 内） */
            content: '';
            position: absolute;
            top: 16px; left: 16px; right: 16px; bottom: 16px;
        }
        .plan-img {
            width: 100%;
            border-radius: 8px;
            display: block;
        }
        .plan-hotspots {
            position: absolute;
            top: 16px; left: 16px;
            width: calc(100% - 32px); height: calc(100% - 32px);
        }
        .plan-hint {
            text-align: center;
            color: #5f6d96;
            font-size: 12px;
            padding: 8px;
        }
        .hs {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(8, 30, 60, 0.78);
            border: 1px solid rgba(0, 200, 255, 0.75);
            border-radius: 8px;
            color: #fff;
            box-shadow: 0 0 8px rgba(0, 200, 255, 0.35), inset 0 0 6px rgba(0, 200, 255, 0.12);
            backdrop-filter: blur(2px);
            transition: all 0.25s;
            animation: hsPulse 2.2s ease-in-out infinite;
            overflow: hidden;
            z-index: 5;
        }
        @keyframes hsPulse {
            0%, 100% { box-shadow: 0 0 6px rgba(0, 200, 255, 0.25), inset 0 0 6px rgba(0, 200, 255, 0.1); }
            50% { box-shadow: 0 0 16px rgba(0, 200, 255, 0.6), inset 0 0 10px rgba(0, 200, 255, 0.2); }
        }
        .hs:hover {
            background: rgba(0, 140, 220, 0.9);
            transform: scale(1.12);
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.8);
            animation: none;
            z-index: 20;
        }
        .hs-label {
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            line-height: 1.25;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
            white-space: nowrap;
        }
        .hs.shop .hs-label { color: #ffd77a; }
        .hs:hover .hs-label {
            background: rgba(0, 140, 220, 0.85);
        }
        .hs.shop {
            border-color: rgba(255, 180, 60, 0.8);
            background: rgba(80, 50, 10, 0.78);
            box-shadow: 0 0 8px rgba(255, 180, 60, 0.35), inset 0 0 6px rgba(255, 180, 60, 0.12);
        }
        .hs.shop:hover {
            background: rgba(230, 150, 30, 0.9);
            border-color: #ffc832;
            box-shadow: 0 0 20px rgba(255, 180, 60, 0.8);
        }
        .building-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
            background: rgba(16, 28, 56, 0.6);
            border: 1px solid rgba(0, 200, 255, 0.15);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .building-chip {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 4px;
            background: rgba(30, 45, 85, 0.7);
            border: 1px solid rgba(0, 200, 255, 0.25);
            border-radius: 10px;
            color: #a8d8ff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
            animation: cardIn 0.5s ease both;
        }
        .building-chip:hover {
            background: linear-gradient(135deg, #00a8e8 0%, #7b68ee 100%);
            border-color: rgba(0, 200, 255, 0.6);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.5);
        }
        .building-chip.shop {
            background: rgba(60, 40, 12, 0.6);
            border-color: rgba(255, 180, 60, 0.3);
            color: #ffd77a;
        }
        .building-chip.shop:hover {
            background: linear-gradient(135deg, #e89620 0%, #c06000 100%);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 180, 60, 0.5);
        }
        .building-chip small {
            display: block;
            font-size: 9px;
            font-weight: 400;
            margin-top: 2px;
            opacity: 0.7;
        }

        /* 户型 */
        .layout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }
        .layout-card {
            background: rgba(16, 28, 56, 0.7);
            border: 1px solid rgba(0, 200, 255, 0.18);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            animation: cardIn 0.5s ease both;
        }
        .layout-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 200, 255, 0.55);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 24px rgba(0, 200, 255, 0.2);
        }
        .layout-cover {
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.1) 0%, rgba(123, 104, 238, 0.08) 100%);
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 200, 255, 0.15);
        }
        .layout-name {
            font-size: 20px;
            font-weight: 400;
            color: #ffe0a0;
            letter-spacing: 3px;
            font-family: 'MaShanZheng', 'STKaiti', '楷体', serif;
            text-shadow: 0 0 14px rgba(255, 215, 122, 0.4);
        }
        .layout-area {
            font-size: 14px;
            font-weight: 600;
            color: #ffd77a;
            letter-spacing: 1px;
            white-space: nowrap;
            opacity: 0.85;
        }
        .layout-area sup {
            font-size: 12px;
            opacity: 0.85;
            margin-left: 1px;
        }
        .layout-img {
            width: 100%;
            display: block;
            background: #0b1226;
            min-height: 320px;
            object-fit: contain;
        }
        .layout-img-missing {
            padding: 60px 20px;
            text-align: center;
            color: #5f6d96;
            font-size: 13px;
            background: #0b1226;
        }
        .layout-body {
            padding: 14px 18px;
        }
        .layout-desc {
            font-size: 12px;
            color: #8a93b8;
            margin-bottom: 10px;
        }
        .layout-features {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .layout-feature {
            background: rgba(0, 200, 255, 0.1);
            border: 1px solid rgba(0, 200, 255, 0.25);
            color: #7fd8ff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
        }
        .layout-buildings {
            padding: 10px 18px 16px;
            border-top: 1px dashed rgba(0, 200, 255, 0.15);
            font-size: 11px;
            color: #5f6d96;
        }
        .layout-buildings b {
            color: #a8d8ff;
            margin-right: 4px;
        }

        /* 销售概况 */
        .overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .kpi {
            background: rgba(16, 28, 56, 0.7);
            border: 1px solid rgba(0, 200, 255, 0.18);
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: cardIn 0.5s ease both;
        }
        .kpi .num {
            font-size: 24px;
            font-weight: 700;
            color: #7fd8ff;
            text-shadow: 0 0 14px rgba(0, 200, 255, 0.45);
        }
        .kpi .lbl {
            font-size: 11px;
            color: #8a93b8;
            margin-top: 4px;
        }

        /* 户型详情弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(4, 8, 20, 0.88);
            backdrop-filter: blur(6px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: linear-gradient(160deg, #101c3c 0%, #0b1226 100%);
            border: 1px solid rgba(0, 200, 255, 0.3);
            border-radius: 14px;
            max-width: 100%;
            max-height: 95vh;
            overflow: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 200, 255, 0.15);
            animation: modalUp 0.3s ease;
        }
        @keyframes modalUp { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: none; } }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 200, 255, 0.15);
            border: 1px solid rgba(0, 200, 255, 0.4);
            color: #7fd8ff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s;
        }
        .modal-close:hover { background: rgba(0, 200, 255, 0.35); color: #fff; }
        .modal-img {
            display: block;
            max-width: 100%;
            max-height: 85vh;
        }
        .modal-empty {
            padding: 80px 40px;
            text-align: center;
            color: #5f6d96;
        }

        .footer {
            text-align: center;
            padding: 30px 16px 40px;
            color: #5f6d96;
            font-size: 11px;
            border-top: 1px solid rgba(0, 200, 255, 0.15);
            margin-top: 30px;
        }
        .footer b { color: #7fd8ff; }

        /* 入场动画 */
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 3D 实景巡航模块 ===== */
        .view3d-card {
            background: rgba(10, 18, 40, 0.8);
            border: 1px solid rgba(0, 200, 255, 0.25);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 200, 255, 0.1);
        }
        .view3d-toolbar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; flex-wrap: wrap;
            padding: 12px 14px;
            background: rgba(0, 200, 255, 0.06);
            border-bottom: 1px solid rgba(0, 200, 255, 0.2);
        }
        .view3d-search { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 220px; }
        .view3d-search input {
            flex: 1; padding: 9px 14px; border-radius: 8px;
            background: rgba(8, 16, 36, 0.9);
            border: 1px solid rgba(0, 200, 255, 0.4);
            color: #dfe8ff; font-size: 14px; outline: none;
            transition: all 0.25s;
        }
        .view3d-search input:focus { border-color: #00c8ff; box-shadow: 0 0 14px rgba(0, 200, 255, 0.35); }
        .view3d-search button {
            padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer;
            background: linear-gradient(135deg, #00a8e8, #7b68ee);
            color: #fff; font-size: 13px; font-weight: 600;
            transition: all 0.25s; white-space: nowrap;
        }
        .view3d-search button:hover { box-shadow: 0 0 18px rgba(0, 200, 255, 0.55); transform: translateY(-1px); }
        .view3d-search a {
            padding: 9px 14px; border-radius: 8px; text-decoration: none;
            background: rgba(255, 215, 122, 0.12);
            border: 1px solid rgba(255, 215, 122, 0.5);
            color: #ffd77a; font-size: 13px; font-weight: 600;
            animation: hlPulse 1.6s ease-in-out infinite;
        }
        .view3d-mode {
            padding: 7px 14px; border-radius: 20px; cursor: pointer;
            background: rgba(0, 200, 255, 0.1);
            border: 1px solid rgba(0, 200, 255, 0.4);
            color: #7fd8ff; font-size: 12px; white-space: nowrap;
            transition: all 0.25s;
        }
        .view3d-mode:hover { background: rgba(0, 200, 255, 0.25); box-shadow: 0 0 14px rgba(0, 200, 255, 0.4); }
        #view3d { width: 100%; height: 380px; display: block; background: #060b18; }
        @media (max-width: 600px) { #view3d { height: 300px; } }
        .view3d-hint { text-align: center; color: #5f6d96; font-size: 11px; padding: 8px; }

        /* 楼栋/房号 下拉菜单 */
        .dd { position: relative; }
        .dd-btn {
            min-width: 96px;
            padding: 9px 12px; border-radius: 2px;
            background: rgba(8, 16, 36, 0.9);
            border: 1px solid rgba(0, 200, 255, 0.4);
            color: #dfe8ff; font-size: 13px; cursor: pointer;
            text-align: left; white-space: nowrap;
            transition: all 0.25s;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        }
        .dd-btn:hover:not(:disabled) { border-color: #00c8ff; box-shadow: 0 0 14px rgba(0, 200, 255, 0.35); }
        .dd-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .dd-list {
            display: none;
            position: absolute; top: calc(100% + 6px); left: 0; z-index: 120;
            min-width: 150px; max-height: 240px; overflow-y: auto;
            background: rgba(8, 14, 32, 0.97);
            border: 1px solid rgba(0, 200, 255, 0.35);
            border-radius: 2px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 200, 255, 0.12);
            backdrop-filter: blur(8px);
        }
        .dd-list.open { display: block; animation: ddIn 0.18s ease; }
        @keyframes ddIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
        .dd-item {
            padding: 9px 14px; font-size: 13px; color: #cfe0ff; cursor: pointer;
            transition: all 0.15s; white-space: nowrap;
            border-left: 3px solid transparent;
        }
        .dd-item:hover { background: rgba(0, 200, 255, 0.16); color: #fff; }
        .dd-item.sel { background: rgba(0, 200, 255, 0.22); border-left-color: #00c8ff; color: #fff; }
        .dd-item.shop-dd { color: #ffd77a; }
        #view3d.loading { opacity: 0.4; }

        /* 自定义滚动条（科技感，与整体风格一致） */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(8, 14, 32, 0.6); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(0, 200, 255, 0.45), rgba(123, 104, 238, 0.45));
            border-radius: 4px;
            border: 1px solid rgba(0, 200, 255, 0.2);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, rgba(0, 200, 255, 0.8), rgba(123, 104, 238, 0.8));
        }
        ::-webkit-scrollbar-corner { background: transparent; }
        * { scrollbar-width: thin; scrollbar-color: rgba(0, 200, 255, 0.5) rgba(8, 14, 32, 0.6); }
    </style>
</head>
<body>
    <div class="hero">
        <div class="brand">TIANHE NO.1</div>
        <h1>天河·壹号</h1>
        <div class="tag">承袭风雅 筑城标杆</div>
        <div class="sub">TOOBEY · 城心低密豪宅</div>
    </div>

    <div class="section">
        <div class="section-title">楼盘总览</div>
        <div class="overview" id="overview"></div>
    </div>

    <div class="section" id="sec3d">
        <div class="section-title">🛸 楼盘 3D 实景巡航</div>
        <div class="section-sub">无人机视角自动巡航 · 点击模式切换 · 拖拽旋转 · 滚轮缩放 · 下拉选择楼栋与房号直达房源</div>
        <div class="view3d-card">
            <div class="view3d-toolbar">
                <div class="view3d-search">
                    <div class="dd" id="bdDD">
                        <button class="dd-btn" id="bdBtn" onclick="toggleDD('bd')">楼栋 ▾</button>
                        <div class="dd-list" id="bdList"></div>
                    </div>
                    <div class="dd" id="rmDD">
                        <button class="dd-btn" id="rmBtn" onclick="toggleDD('rm')" disabled>房号 ▾</button>
                        <div class="dd-list" id="rmList"></div>
                    </div>
                    <button id="roomGo">🎯 定位</button>
                    <a id="roomDetail" href="#" target="_blank" style="display:none">查看房源详情 →</a>
                </div>
                <div class="view3d-mode" id="modeTag">巡航模式: 推拉</div>
            </div>
            <canvas id="view3d"></canvas>
            <div class="view3d-hint">🖱 拖拽旋转 · 滚轮缩放 · 自动巡航中（点击右上模式可切换推拉 / 盘旋 / 环绕）</div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">总平图</div>
        <div class="section-sub">点击下方楼栋编号，查看对应楼栋销控图</div>
        <div class="plan-img-wrap">
            <img class="plan-img" id="planImg" src="floorplans/plan.jpg" alt="项目总平图">
            <div id="planHotspots" class="plan-hotspots"></div>
            <div class="plan-hint">点击楼栋编号进入销控图</div>
        </div>
        <div class="building-grid" id="buildingGrid"></div>
    </div>

    <div class="section">
        <div class="section-title">户型鉴赏</div>
        <div class="section-sub">点击卡片查看户型大图</div>
        <div class="layout-grid" id="layoutGrid"></div>
    </div>

    <div class="footer">
        天河·壹号 · TOOBEY<br>
        本页面房源信息以售楼处现场公示为准
    </div>

    <!-- 户型大图弹窗 -->
    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">×</button>
            <img class="modal-img" id="modalImg" src="" alt="">
        </div>
    </div>

    <script src="data/units.js"></script>
    <script>
        // 销售数据统计
        const allData = window.UNITS;

        function getStatus(d) {
            if (d.signStatus === '已网签') return 'sold';
            if (d.customer && d.customer !== '-') return 'subscribed';
            return 'unsold';
        }

        function renderOverview() {
            const total = allData.length;
            const sold = allData.filter(d => getStatus(d) === 'sold').length;
            const sub = allData.filter(d => getStatus(d) === 'subscribed').length;
            const unsold = allData.filter(d => getStatus(d) === 'unsold').length;
            const houseTotal = allData.filter(d => d.type === '住宅').length;
            const shopTotal = allData.filter(d => d.type === '商铺').length;

            document.getElementById('overview').innerHTML = `
                <div class="kpi"><div class="num" data-v="${total}">0</div><div class="lbl">总套数</div></div>
                <div class="kpi"><div class="num" data-v="${sold}" style="color:#ff5d7a;text-shadow:0 0 14px rgba(255,93,122,0.5)">0</div><div class="lbl">已售</div></div>
                <div class="kpi"><div class="num" data-v="${sub}" style="color:#ffb347;text-shadow:0 0 14px rgba(255,179,71,0.5)">0</div><div class="lbl">认购</div></div>
                <div class="kpi"><div class="num" data-v="${unsold}">0</div><div class="lbl">在售</div></div>
                <div class="kpi"><div class="num" data-v="${houseTotal}">0</div><div class="lbl">住宅</div></div>
                <div class="kpi"><div class="num" data-v="${shopTotal}">0</div><div class="lbl">商铺</div></div>
            `;
            // 数字滚动
            document.querySelectorAll('#overview .num').forEach((el, i) => {
                const target = parseInt(el.dataset.v, 10);
                setTimeout(() => {
                    const start = performance.now(), dur = 800;
                    function tick(now) {
                        const p = Math.min((now - start) / dur, 1);
                        el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
                        if (p < 1) requestAnimationFrame(tick);
                    }
                    requestAnimationFrame(tick);
                }, i * 120);
            });
            // 卡片入场 stagger
            document.querySelectorAll('#overview .kpi').forEach((el, i) => {
                el.style.animationDelay = (i * 0.1) + 's';
            });
        }

        // 总平图楼栋列表
        const buildings = ["1#", "2#", "3#", "5#", "6#", "7#", "8#", "9#", "10#", "11#", "12#", "13#", "15#", "16#", "17#", "18#", "19#", "20#", "13商铺#", "18商铺#", "19商铺#", "20商铺#", "S2#", "S3商铺#", "S4商铺#"];

        function renderBuildingGrid() {
            // 楼栋显示名映射
            const bname = b => ({ 'S3商铺#': 'S3', 'S4商铺#': 'S4', '13商铺#': '13商', '18商铺#': '18商', '19商铺#': '19商', '20商铺#': '20商' })[b] || String(b).replace('#', '');
            const isShop = b => b.includes('商铺') || b.startsWith('S');
            document.getElementById('buildingGrid').innerHTML = buildings.map(b => {
                const cls = isShop(b) ? 'building-chip shop' : 'building-chip';
                return `<a class="${cls}" href="sales_control_v2.html?b=${encodeURIComponent(b)}" target="_blank" title="${b}">
                    ${bname(b)}
                </a>`;
            }).join('');
            // 入场 stagger
            document.querySelectorAll('.building-chip').forEach((el, i) => {
                el.style.animationDelay = (i * 0.04) + 's';
            });
        }

        // 户型数据
        const layouts = {"168": {"name": "乐山", "area": 168, "desc": "四室两厅三卫 · 8.1米至宽景观阳台", "rooms": 4, "halls": 2, "baths": 3, "feature": "南北双阳台"}, "188": {"name": "乐水", "area": 188, "desc": "四室两厅三卫 · 9.6米至宽景观阳台", "rooms": 4, "halls": 2, "baths": 3, "feature": "电梯前室可做私属门厅"}, "246": {"name": "拾雅", "area": 246, "desc": "四室两厅三卫 · 一层一户 L型阳台", "rooms": 4, "halls": 2, "baths": 3, "feature": "3.4米层高"}, "268": {"name": "云庭", "area": 268, "desc": "四室两厅四卫 · 全套房格局 270°IMAX视野", "rooms": 4, "halls": 2, "baths": 4, "feature": "一层一户"}, "288": {"name": "观云", "area": 288, "desc": "四室两厅五卫 · L型全景阳台", "rooms": 4, "halls": 2, "baths": 5, "feature": "独层专享豪宅设计"}};
        const layoutBuildings = {"168": ["11#", "2#", "3#", "5#"], "188": ["1#", "13#", "18#", "19#", "20#", "6#", "8#", "9#"], "246": ["10#", "15#", "17#"], "268": ["7#"], "288": ["16#"]};

        function renderLayouts() {
            document.getElementById('layoutGrid').innerHTML = Object.entries(layouts).map(([key, l]) => {
                const buildingsStr = (layoutBuildings[key] || []).join('、');
                return `
                <a class="layout-card" onclick="openLayout('${key}', '${l.name}'); return false;">
                    <div class="layout-cover">
                        <div class="layout-area">${l.area}<sup>㎡</sup> · 户型鉴赏</div>
                        <div class="layout-name">${l.name}</div>
                    </div>
                    <img class="layout-img" id="img-${key}" alt="${l.name} ${l.area}㎡">
                    <div class="layout-body">
                        <div class="layout-desc">${l.desc}</div>
                        <div class="layout-features">
                            <span class="layout-feature">${l.rooms}室${l.halls}厅${l.baths}卫</span>
                            <span class="layout-feature">${l.feature}</span>
                        </div>
                    </div>
                    <div class="layout-buildings">
                        <b>分布楼栋：</b>${buildingsStr || '—'}
                    </div>
                </a>`;
            }).join('');
            // 入场 stagger
            document.querySelectorAll('.layout-card').forEach((el, i) => {
                el.style.animationDelay = (i * 0.12) + 's';
            });
            // 异步尝试 jpg → svg 加载
            Object.keys(layouts).forEach(key => loadFloorplan(key));
        }

        // 图片加载顺序: jpg → png → svg
        function tryImage(imgEl, paths) {
            let idx = 0;
            function tryNext() {
                if (idx >= paths.length) {
                    const key = imgEl.id === 'modalImg' ? '' : imgEl.id.replace('img-','');
                const showName = key && layouts[key] ? layouts[key].name : '该户型';
                imgEl.outerHTML = '<div class="layout-img-missing">户型图待补充<br><small>请将 ' + showName + ' 户型图保存为 floorplans/' + (key || 'key') + '.jpg</small></div>';
                    return;
                }
                const t = new Image();
                t.onload = () => { imgEl.src = t.src; };
                t.onerror = () => { idx++; tryNext(); };
                t.src = paths[idx];
            }
            tryNext();
        }

        function loadFloorplan(key) {
            const img = document.getElementById('img-' + key);
            if (!img) return;
            tryImage(img, [
                'floorplans/' + key + '.jpg',
                'floorplans/' + key + '.png',
                'floorplans/' + key + '.svg'
            ]);
        }

        function openLayout(key, name) {
            const modalImg = document.getElementById('modalImg');
            tryImage(modalImg, [
                'floorplans/' + key + '.jpg',
                'floorplans/' + key + '.png',
                'floorplans/' + key + '.svg'
            ]);
            document.getElementById('modalOverlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        // ===== 总平图热点 =====
        const buildings_hotspots = [
            {id:'20#',label:'20#<br>188㎡',x:22.0,y:8.0,w:4.5,h:14.0},
            {id:'19#',label:'19#<br>188㎡',x:26.0,y:8.0,w:4.0,h:14.0},
            {id:'18#',label:'18#<br>188㎡',x:29.5,y:10.0,w:4.0,h:14.0},
            {id:'16#',label:'16#<br>288㎡',x:27.0,y:14.0,w:4.0,h:17.0},
            {id:'17#',label:'17#<br>246㎡',x:22.5,y:17.0,w:3.5,h:6.0},
            {id:'13#',label:'13#<br>188㎡',x:31.0,y:15.5,w:4.5,h:15.0},
            {id:'15#',label:'15#<br>246㎡',x:22.5,y:21.0,w:3.5,h:6.0},
            {id:'6#', label:'6#<br>188㎡', x:32.0,y:22.0,w:4.5,h:15.0},
            {id:'8#', label:'8#<br>188㎡', x:23.0,y:26.0,w:5.0,h:8.5},
            {id:'7#', label:'7#<br>268㎡', x:28.0,y:24.0,w:4.0,h:14.0},
            {id:'9#', label:'9#<br>188㎡', x:18.0,y:26.5,w:5.0,h:8.5},
            {id:'10#',label:'10#<br>246㎡',x:14.5,y:28.0,w:4.0,h:7.0},
            {id:'1#', label:'1#<br>188㎡', x:33.0,y:30.0,w:4.5,h:17.0},
            {id:'11#',label:'11#<br>168㎡',x:10.5,y:29.5,w:4.5,h:6.5},
            {id:'12#',label:'12#<br>198㎡',x:6.5, y:30.5,w:3.5,h:6.5},
            {id:'5#', label:'5#<br>168㎡', x:7.0, y:36.0,w:7.5,h:6.0},
            {id:'3#', label:'3#<br>168㎡', x:15.5,y:36.0,w:8.0,h:6.5},
            {id:'2#', label:'2#<br>168㎡', x:24.5,y:36.0,w:7.0,h:6.5},
            {id:'S2#',label:'S2#<br>商铺',x:34.5,y:44.0,w:5.0,h:4.5,shop:true},
            {id:'S3#',label:'S3#<br>商铺',x:30.0,y:44.0,w:4.0,h:4.5,shop:true},
            {id:'S4#',label:'S4#<br>商铺',x:22.0,y:44.0,w:6.0,h:4.5,shop:true},
            {id:'13商铺#',label:'13商铺#',x:19.5,y:35.5,w:4.0,h:4.0,shop:true},
            {id:'18商铺#',label:'18商铺#',x:33.0,y:16.0,w:3.5,h:3.5,shop:true},
            {id:'19商铺#',label:'19商铺#',x:28.0,y:9.0, w:3.5,h:3.5,shop:true},
            {id:'20商铺#',label:'20商铺#',x:23.5,y:9.0, w:3.5,h:3.5,shop:true},
        ];

        function renderPlanHotspots() {
            // 总平图楼栋热点标签已按用户要求移除（保留调用，如需恢复启用 resolveOverlaps 逻辑）
            const wrap = document.getElementById('planHotspots');
            if (wrap) wrap.innerHTML = '';
        }

        renderOverview();
        renderBuildingGrid();
        renderLayouts();
        renderPlanHotspots();

        // 暴露给 3D 巡航模块
        window.BUILDINGS_HOTSPOTS = buildings_hotspots;
    </script>

    <!-- 3D 实景巡航引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

</body>
