<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>楼盘可视化-Toobey · 演示楼盘:襄河·1号</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #faf8f5 0%, #f0ebe2 100%);
            color: #2c2c2c;
            min-height: 100vh;
        }
        .hero {
            background: linear-gradient(135deg, #8b6f47 0%, #6b5435 100%);
            color: #fff;
            padding: 50px 20px 40px;
            text-align: center;
        }
        .hero .brand {
            font-size: 12px;
            letter-spacing: 4px;
            opacity: 0.7;
            margin-bottom: 12px;
        }
        .hero h1 {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 6px;
            margin-bottom: 8px;
            font-family: 'STSong', '宋体', serif;
        }
        .hero .tag {
            display: inline-block;
            background: rgba(255,255,255,0.18);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }
        .hero .sub {
            font-size: 13px;
            opacity: 0.85;
            letter-spacing: 1px;
        }
        .section {
            padding: 28px 16px;
            max-width: 900px;
            margin: 0 auto;
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #6b5435;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e8dfd0;
        }
        .section-title::before {
            content: '';
            display: block;
            width: 4px;
            height: 18px;
            background: #8b6f47;
            border-radius: 2px;
        }
        .section-sub {
            font-size: 12px;
            color: #999;
            margin-bottom: 16px;
        }

        /* 总平图 */
        .plan-img-wrap {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }
        .plan-img {
            width: 100%;
            border-radius: 8px;
            display: block;
        }
        .plan-img-wrap {
            position: relative;
        }
        .plan-hotspots {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .plan-hint {
            text-align: center;
            color: #bbb;
            font-size: 12px;
            padding: 8px;
        }
        .hs {
            position: absolute;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 2px solid rgba(74,144,217,0.8);
            background: rgba(74,144,217,0.25);
            transition: all 0.2s;
            overflow: hidden;
        }
        .hs:hover {
            background: rgba(255,200,50,0.4) !important;
            border-color: #ffc832 !important;
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 4px 16px rgba(255,200,50,0.5);
        }
        .hs-label {
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            line-height: 1.2;
            background: rgba(0,0,0,0.6);
            padding: 3px 6px;
            border-radius: 4px;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .hs:hover .hs-label {
            background: rgba(200,140,0,0.85);
        }
        .hs.shop {
            border-color: rgba(224,112,64,0.8) !important;
            background: rgba(224,112,64,0.25) !important;
        }
        .hs.shop:hover {
            background: rgba(255,200,50,0.4) !important;
            border-color: #ffc832 !important;
        }
        .building-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
            background: #fff;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .building-chip {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 4px;
            background: linear-gradient(135deg, #faf6ed 0%, #f0e8d8 100%);
            border: 1.5px solid #e8dfd0;
            border-radius: 10px;
            color: #6b5435;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .building-chip:hover {
            background: linear-gradient(135deg, #8b6f47 0%, #6b5435 100%);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 111, 71, 0.25);
        }
        .building-chip.shop {
            background: #fef5f0;
            border-color: #f0d8c4;
            color: #b8552e;
        }
        .building-chip.shop:hover {
            background: linear-gradient(135deg, #c8552e 0%, #a03a1c 100%);
            color: #fff;
        }
        .building-chip small {
            display: block;
            font-size: 9px;
            font-weight: 400;
            margin-top: 2px;
            opacity: 0.7;
        }

        /* 户型 */
        .layout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }
        .layout-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .layout-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(139, 111, 71, 0.15);
        }
        .layout-cover {
            background: linear-gradient(135deg, #f5efe6 0%, #e8dfd0 100%);
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid #f0e8d8;
        }
        .layout-name {
            font-size: 22px;
            font-weight: 700;
            color: #6b5435;
            font-family: 'STSong', '宋体', serif;
        }
        .layout-area {
            font-size: 28px;
            font-weight: 700;
            color: #8b6f47;
        }
        .layout-area sup {
            font-size: 14px;
            opacity: 0.7;
            margin-left: 2px;
        }
        .layout-img {
            width: 100%;
            display: block;
            background: #f5efe6;
            min-height: 200px;
            object-fit: contain;
        }
        .layout-img-missing {
            padding: 60px 20px;
            text-align: center;
            color: #bbb;
            font-size: 13px;
            background: #faf8f5;
        }
        .layout-body {
            padding: 14px 18px;
        }
        .layout-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }
        .layout-features {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .layout-feature {
            background: #faf6ed;
            color: #6b5435;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
        }
        .layout-buildings {
            padding: 10px 18px 16px;
            border-top: 1px dashed #f0e8d8;
            font-size: 11px;
            color: #999;
        }
        .layout-buildings b {
            color: #6b5435;
            margin-right: 4px;
        }

        /* 销售概况 */
        .overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .kpi {
            background: #fff;
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .kpi .num {
            font-size: 24px;
            font-weight: 700;
            color: #6b5435;
        }
        .kpi .lbl {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        /* 户型详情弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 12px;
            max-width: 100%;
            max-height: 95vh;
            overflow: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
        }
        .modal-img {
            display: block;
            max-width: 100%;
            max-height: 85vh;
        }
        .modal-empty {
            padding: 80px 40px;
            text-align: center;
            color: #999;
        }

        .footer {
            text-align: center;
            padding: 30px 16px 40px;
            color: #999;
            font-size: 11px;
            border-top: 1px solid #f0e8d8;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="brand">XIANGHE NO.1</div>
        <h1>襄河·1号</h1>
        <div class="tag">承袭风雅 筑城标杆</div>
        <div class="sub">雅筑地产 · 城心低密豪宅</div>
    </div>

    <div class="section">
        <div class="section-title">楼盘总览</div>
        <div class="overview" id="overview"></div>
    </div>

    <div class="section">
        <div class="section-title">总平图</div>
        <div class="section-sub">点击下方楼栋编号，查看对应楼栋销控图</div>
        <div class="plan-img-wrap">
            <img class="plan-img" id="planImg" src="floorplans/plan.jpg" alt="项目总平图">
            <div id="planHotspots" class="plan-hotspots"></div>
            <div class="plan-hint">点击楼栋编号进入销控图</div>
        </div>
        <div class="building-grid" id="buildingGrid"></div>
    </div>

    <div class="section">
        <div class="section-title">户型鉴赏</div>
        <div class="section-sub">点击卡片查看户型大图</div>
        <div class="layout-grid" id="layoutGrid"></div>
    </div>

    <div class="footer">
        襄河·1号 · 雅筑地产<br>
        本页面房源信息以售楼处现场公示为准
    </div>

    <!-- 户型大图弹窗 -->
    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">×</button>
            <img class="modal-img" id="modalImg" src="" alt="">
        </div>
    </div>

    <script src="data/units.js"></script>
    <script>
        // 销售数据统计
        const allData = window.UNITS;

        function getStatus(d) {
            if (d.signStatus === '已网签') return 'sold';
            if (d.customer && d.customer !== '-') return 'subscribed';
            return 'unsold';
        }

        function renderOverview() {
            const total = allData.length;
            const sold = allData.filter(d => getStatus(d) === 'sold').length;
            const sub = allData.filter(d => getStatus(d) === 'subscribed').length;
            const unsold = allData.filter(d => getStatus(d) === 'unsold').length;
            const houseTotal = allData.filter(d => d.type === '住宅').length;
            const shopTotal = allData.filter(d => d.type === '商铺').length;

            document.getElementById('overview').innerHTML = `
                <div class="kpi"><div class="num">${total}</div><div class="lbl">总套数</div></div>
                <div class="kpi"><div class="num" style="color:#c62828">${sold}</div><div class="lbl">已售</div></div>
                <div class="kpi"><div class="num" style="color:#ef6c00">${sub}</div><div class="lbl">认购</div></div>
                <div class="kpi"><div class="num">${unsold}</div><div class="lbl">在售</div></div>
                <div class="kpi"><div class="num">${houseTotal}</div><div class="lbl">住宅</div></div>
                <div class="kpi"><div class="num">${shopTotal}</div><div class="lbl">商铺</div></div>
            `;
        }

        // 总平图楼栋列表
        const buildings = ["1#", "2#", "3#", "5#", "6#", "7#", "8#", "9#", "10#", "11#", "12#", "13#", "15#", "16#", "17#", "18#", "19#", "20#", "13商铺#", "18商铺#", "19商铺#", "20商铺#", "S2#", "S3商铺#", "S4商铺#"];

        function renderBuildingGrid() {
            const isShop = b => b.includes('商铺') || b.startsWith('S');
            document.getElementById('buildingGrid').innerHTML = buildings.map(b => {
                const cls = isShop(b) ? 'building-chip shop' : 'building-chip';
                return `<a class="${cls}" href="sales_control_v2.html" target="_blank" title="${b}">
                    ${b}<small>查看销控</small>
                </a>`;
            }).join('');
        }

        // 户型数据
        const layouts = {"168": {"name": "乐山", "area": 168, "desc": "四室两厅三卫 · 8.1米至宽景观阳台", "rooms": 4, "halls": 2, "baths": 3, "feature": "南北双阳台"}, "188": {"name": "乐水", "area": 188, "desc": "四室两厅三卫 · 9.6米至宽景观阳台", "rooms": 4, "halls": 2, "baths": 3, "feature": "电梯前室可做私属门厅"}, "246": {"name": "拾雅", "area": 246, "desc": "四室两厅三卫 · 一层一户 L型阳台", "rooms": 4, "halls": 2, "baths": 3, "feature": "3.4米层高"}, "268": {"name": "云庭", "area": 268, "desc": "四室两厅四卫 · 全套房格局 270°IMAX视野", "rooms": 4, "halls": 2, "baths": 4, "feature": "一层一户"}, "288": {"name": "观云", "area": 288, "desc": "四室两厅五卫 · L型全景阳台", "rooms": 4, "halls": 2, "baths": 5, "feature": "独层专享豪宅设计"}};
        const layoutBuildings = {"168": ["11#", "2#", "3#", "5#"], "188": ["1#", "13#", "18#", "19#", "20#", "6#", "8#", "9#"], "246": ["10#", "15#", "17#"], "268": ["7#"], "288": ["16#"]};

        function renderLayouts() {
            document.getElementById('layoutGrid').innerHTML = Object.entries(layouts).map(([key, l]) => {
                const buildingsStr = (layoutBuildings[key] || []).join('、');
                return `
                <a class="layout-card" onclick="openLayout('${key}', '${l.name}'); return false;">
                    <div class="layout-cover">
                        <div class="layout-name">${l.name}</div>
                        <div class="layout-area">${l.area}<sup>㎡</sup></div>
                    </div>
                    <img class="layout-img" id="img-${key}" alt="${l.name} ${l.area}㎡">
                    <div class="layout-body">
                        <div class="layout-desc">${l.desc}</div>
                        <div class="layout-features">
                            <span class="layout-feature">${l.rooms}室${l.halls}厅${l.baths}卫</span>
                            <span class="layout-feature">${l.feature}</span>
                        </div>
                    </div>
                    <div class="layout-buildings">
                        <b>分布楼栋：</b>${buildingsStr || '—'}
                    </div>
                </a>`;
            }).join('');
            // 异步尝试 jpg → svg 加载
            Object.keys(layouts).forEach(key => loadFloorplan(key));
        }

        // 图片加载顺序: jpg → png → svg
        function tryImage(imgEl, paths) {
            let idx = 0;
            function tryNext() {
                if (idx >= paths.length) {
                    const key = imgEl.id === 'modalImg' ? '' : imgEl.id.replace('img-','');
                const showName = key && layouts[key] ? layouts[key].name : '该户型';
                imgEl.outerHTML = '<div class="layout-img-missing">户型图待补充<br><small>请将 ' + showName + ' 户型图保存为 floorplans/' + (key || 'key') + '.jpg</small></div>';
                    return;
                }
                const t = new Image();
                t.onload = () => { imgEl.src = t.src; };
                t.onerror = () => { idx++; tryNext(); };
                t.src = paths[idx];
            }
            tryNext();
        }

        function loadFloorplan(key) {
            const img = document.getElementById('img-' + key);
            if (!img) return;
            tryImage(img, [
                'floorplans/' + key + '.jpg',
                'floorplans/' + key + '.png',
                'floorplans/' + key + '.svg'
            ]);
        }

        function openLayout(key, name) {
            const modalImg = document.getElementById('modalImg');
            tryImage(modalImg, [
                'floorplans/' + key + '.jpg',
                'floorplans/' + key + '.png',
                'floorplans/' + key + '.svg'
            ]);
            document.getElementById('modalOverlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        // ===== 总平图热点 =====
        const buildings_hotspots = [
            {id:'20#',label:'20#<br>188㎡',x:22.0,y:8.0,w:4.5,h:14.0},
            {id:'19#',label:'19#<br>188㎡',x:26.0,y:8.0,w:4.0,h:14.0},
            {id:'18#',label:'18#<br>188㎡',x:29.5,y:10.0,w:4.0,h:14.0},
            {id:'16#',label:'16#<br>288㎡',x:27.0,y:14.0,w:4.0,h:17.0},
            {id:'17#',label:'17#<br>246㎡',x:22.5,y:17.0,w:3.5,h:6.0},
            {id:'13#',label:'13#<br>188㎡',x:31.0,y:15.5,w:4.5,h:15.0},
            {id:'15#',label:'15#<br>246㎡',x:22.5,y:21.0,w:3.5,h:6.0},
            {id:'6#', label:'6#<br>188㎡', x:32.0,y:22.0,w:4.5,h:15.0},
            {id:'8#', label:'8#<br>188㎡', x:23.0,y:26.0,w:5.0,h:8.5},
            {id:'7#', label:'7#<br>268㎡', x:28.0,y:24.0,w:4.0,h:14.0},
            {id:'9#', label:'9#<br>188㎡', x:18.0,y:26.5,w:5.0,h:8.5},
            {id:'10#',label:'10#<br>246㎡',x:14.5,y:28.0,w:4.0,h:7.0},
            {id:'1#', label:'1#<br>188㎡', x:33.0,y:30.0,w:4.5,h:17.0},
            {id:'11#',label:'11#<br>168㎡',x:10.5,y:29.5,w:4.5,h:6.5},
            {id:'12#',label:'12#<br>198㎡',x:6.5, y:30.5,w:3.5,h:6.5},
            {id:'5#', label:'5#<br>168㎡', x:7.0, y:36.0,w:7.5,h:6.0},
            {id:'3#', label:'3#<br>168㎡', x:15.5,y:36.0,w:8.0,h:6.5},
            {id:'2#', label:'2#<br>168㎡', x:24.5,y:36.0,w:7.0,h:6.5},
            {id:'S2#',label:'S2#<br>商铺',x:34.5,y:44.0,w:5.0,h:4.5,shop:true},
            {id:'S3#',label:'S3#<br>商铺',x:30.0,y:44.0,w:4.0,h:4.5,shop:true},
            {id:'S4#',label:'S4#<br>商铺',x:22.0,y:44.0,w:6.0,h:4.5,shop:true},
            {id:'13商铺#',label:'13商铺#',x:19.5,y:35.5,w:4.0,h:4.0,shop:true},
            {id:'18商铺#',label:'18商铺#',x:33.0,y:16.0,w:3.5,h:3.5,shop:true},
            {id:'19商铺#',label:'19商铺#',x:28.0,y:9.0, w:3.5,h:3.5,shop:true},
            {id:'20商铺#',label:'20商铺#',x:23.5,y:9.0, w:3.5,h:3.5,shop:true},
        ];

        function renderPlanHotspots() {
            const wrap = document.getElementById('planHotspots');
            if (!wrap) return;
            wrap.innerHTML = buildings_hotspots.map(b => `
                <a class="hs${b.shop ? ' shop' : ''}" href="sales_control_v2.html?b=${encodeURIComponent(b.id)}" title="${b.id}">
                    <span class="hs-label">${b.label}</span>
                </a>`).join('');
        }

        renderOverview();
        renderBuildingGrid();
        renderLayouts();
        renderPlanHotspots();
    </script>
</body>
</html>
