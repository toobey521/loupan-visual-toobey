<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销售分析看板-Toobey · 天河·壹号</title>
<style>
    @font-face {
        font-family: 'MaShanZheng';
        src: url('fonts/MaShanZheng-Regular.ttf') format('truetype');
        font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background:
            linear-gradient(rgba(0, 200, 255, 0.045) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 200, 255, 0.045) 1px, transparent 1px),
            linear-gradient(160deg, #080c1a 0%, #0d1730 50%, #091226 100%);
        background-size: 44px 44px, 44px 44px, 100% 100%;
        color: #dfe3f2;
        min-height: 100vh;
    }
    .header {
        background: radial-gradient(ellipse 70% 60% at 50% -30%, rgba(0, 200, 255, 0.22) 0%, transparent 60%), linear-gradient(135deg, #101c3c 0%, #16245c 50%, #1a1040 100%);
        padding: 16px;
        text-align: center;
        border-bottom: 1px solid rgba(0, 200, 255, 0.25);
        position: sticky; top: 0; z-index: 100;
    }
    .header h1 {
        font-size: 24px;
        font-family: 'MaShanZheng', 'STKaiti', '楷体', serif;
        font-weight: 400;
        letter-spacing: 4px;
        background: linear-gradient(180deg, #fff8e6 0%, #ffd77a 45%, #c8933a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 14px rgba(255, 200, 80, 0.4));
    }
    .header .sub { font-size: 12px; color: #7c87ad; margin-top: 4px; }
    .back-home {
        position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
        color: #9fd8ff; text-decoration: none; font-size: 13px;
        border: 1px solid rgba(0, 200, 255, 0.4); padding: 7px 14px; border-radius: 2px;
        background: rgba(0, 200, 255, 0.08);
        clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        transition: all 0.2s;
    }
    .back-home:hover { background: rgba(0, 200, 255, 0.2); box-shadow: 0 0 12px rgba(0, 200, 255, 0.35); }
    .nav-right { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }

    .kpis {
        max-width: 1500px; margin: 16px auto 0; padding: 0 16px;
        display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px;
    }
    .kpi {
        background: rgba(16, 28, 56, 0.7);
        border: 1px solid rgba(0, 200, 255, 0.18);
        border-radius: 2px; padding: 16px 12px; text-align: center;
        clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
        animation: cardIn 0.5s ease both;
    }
    .kpi .num { font-size: 26px; font-weight: 800; text-shadow: 0 0 16px currentColor; }
    .kpi .lbl { font-size: 12px; color: #8a93b8; margin-top: 4px; }
    .kpi:nth-child(1) .num { color: #7fd8ff; }
    .kpi:nth-child(2) .num { color: #4ade80; }
    .kpi:nth-child(3) .num { color: #ffb347; }
    .kpi:nth-child(4) .num { color: #8a93b8; }
    .kpi:nth-child(5) .num { color: #ff5d7a; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .grid {
        max-width: 1500px; margin: 14px auto 40px; padding: 0 16px;
        display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px;
    }
    @media (max-width: 640px) {
        .header {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 8px; padding: 12px 10px;
        }
        .header .back-home {
            position: static !important; transform: none !important;
            margin: 0 2px; font-size: 12px; padding: 6px 10px;
        }
        .header .nav-right {
            position: static !important; transform: none !important;
            width: 100%; justify-content: center; order: 3; margin-top: 2px;
        }
        .header h1 { width: 100%; order: 2; font-size: 20px; }
        .header .sub { width: 100%; order: 4; }
    }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .panel {
        background: rgba(14, 24, 50, 0.78);
        border: 1px solid rgba(0, 200, 255, 0.18);
        border-radius: 10px; padding: 12px 12px 8px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35), 0 0 18px rgba(0, 200, 255, 0.05);
        animation: cardIn 0.6s ease both;
    }
    .panel-title {
        font-size: 14px; font-weight: 700; color: #e8ecff; margin-bottom: 6px;
        padding-left: 10px; position: relative;
    }
    .panel-title::before {
        content: ''; position: absolute; left: 0; top: 2px; bottom: 2px; width: 4px;
        background: linear-gradient(180deg, #00c8ff, #7b68ee); border-radius: 2px;
        box-shadow: 0 0 8px rgba(0, 200, 255, 0.6);
    }
    .chart { width: 100%; height: 300px; }
    .chart.tall { height: 340px; }

    .tables { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 1500px; margin: 0 auto 40px; padding: 0 16px; }
    @media (max-width: 900px) { .tables { grid-template-columns: 1fr; } }
    .table-panel {
        background: rgba(14, 24, 50, 0.78);
        border: 1px solid rgba(0, 200, 255, 0.18); border-radius: 10px; padding: 12px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
    .table-panel h3 { font-size: 14px; color: #e8ecff; margin-bottom: 8px; padding-left: 10px; position: relative; }
    .table-panel h3::before { content: ''; position: absolute; left: 0; top: 2px; bottom: 2px; width: 4px; background: linear-gradient(180deg, #00c8ff, #7b68ee); border-radius: 2px; }
    .table-panel table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .table-panel th { background: rgba(0, 200, 255, 0.1); color: #7fd8ff; padding: 7px 6px; text-align: left; border: 1px solid rgba(0, 200, 255, 0.12); white-space: nowrap; }
    .table-panel td { padding: 6px; border: 1px solid rgba(0, 200, 255, 0.08); color: #c8d4f0; }
    .table-panel tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 11px; }
    .tag-s { background: rgba(74, 222, 128, 0.18); color: #4ade80; }
    .tag-u { background: rgba(251, 191, 36, 0.18); color: #ffb347; }
    .tag-w { background: rgba(139, 147, 184, 0.2); color: #9aa3c0; }

    .tip { max-width: 1500px; margin: 10px auto 0; padding: 0 16px; font-size: 11px; color: #5f6d96; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(8, 14, 32, 0.6); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(0, 200, 255, 0.45), rgba(123, 104, 238, 0.45)); border-radius: 4px; border: 1px solid rgba(0, 200, 255, 0.2); }
    * { scrollbar-width: thin; scrollbar-color: rgba(0, 200, 255, 0.5) rgba(8, 14, 32, 0.6); }
</style>
</head>
<body>

<div class="header">
    <a href="sales_control_v2.html" class="back-home">← 返回销控</a>
    <div class="nav-right">
        <a href="index.html" class="back-home" style="position:static;transform:none">🏠 主页</a>
        <a href="data_editor.html" class="back-home" style="position:static;transform:none">📊 数据管理</a>
    </div>
    <h1>销售分析看板</h1>
    <div class="sub">天河·壹号 · 数据实时来自房源数据源（与销控/3D 同步）</div>
</div>

<div class="kpis" id="kpis"></div>
<div class="tip">💡 图表随数据源自动更新：修改数据管理页并保存后刷新本页即可。</div>

<div class="grid">
    <div class="panel"><div class="panel-title">各楼栋房源构成（总户数 · 网签 · 认购）</div><div class="chart tall" id="cBuildings"></div></div>
    <div class="panel"><div class="panel-title">各楼栋去化率（已网签占比）</div><div class="chart" id="cRate"></div></div>
    <div class="panel"><div class="panel-title">整体去化结构（网签 / 认购 / 待售）</div><div class="chart" id="cPie"></div></div>
    <div class="panel"><div class="panel-title">各日期网签趋势（按月网签量连线）</div><div class="chart" id="cTrend"></div></div>
    <div class="panel"><div class="panel-title">户型分布与去化</div><div class="chart" id="cLayout"></div></div>
    <div class="panel"><div class="panel-title">面积段分布</div><div class="chart" id="cArea"></div></div>
    <div class="panel"><div class="panel-title">单价区间分布</div><div class="chart" id="cPrice"></div></div>
    <div class="panel"><div class="panel-title">各楼栋成交均价对比（已网签）</div><div class="chart" id="cDeal"></div></div>
</div>

<div class="tables">
    <div class="table-panel">
        <h3>🏆 最近网签（按日期）</h3>
        <table id="tRecent"><thead><tr><th>日期</th><th>楼栋</th><th>房号</th><th>客户</th><th>成交总价</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="table-panel">
        <h3>👥 认购中房源</h3>
        <table id="tSub"><thead><tr><th>楼栋</th><th>房号</th><th>户型</th><th>认购客户</th><th>总价</th></tr></thead><tbody></tbody></table>
    </div>
</div>

<script src="data/units.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
    const data = JSON.parse(JSON.stringify(window.UNITS));
    const isSold = d => d.signStatus === '已网签';
    const isSub = d => d.customer && d.customer !== '-' && d.signStatus !== '已网签';
    const BNAME = b => ({ 'S3商铺#': 'S3', 'S4商铺#': 'S4', '13商铺#': '13商', '18商铺#': '18商', '19商铺#': '19商', '20商铺#': '20商' })[b] || String(b).replace('#', '');

    // 状态统计
    let sold = 0, sub = 0;
    data.forEach(d => { if (isSold(d)) sold++; else if (isSub(d)) sub++; });
    const unsold = data.length - sold - sub;
    const rate = (sold / data.length * 100).toFixed(1);

    // KPI
    document.getElementById('kpis').innerHTML = `
        <div class="kpi"><div class="num">${data.length}</div><div class="lbl">总套数</div></div>
        <div class="kpi"><div class="num">${sold}</div><div class="lbl">已网签</div></div>
        <div class="kpi"><div class="num">${sub}</div><div class="lbl">认购中</div></div>
        <div class="kpi"><div class="num">${unsold}</div><div class="lbl">待售</div></div>
        <div class="kpi"><div class="num">${rate}%</div><div class="lbl">去化率</div></div>`;

    // 楼栋排序 (数字优先)
    const buildings = [...new Set(data.map(d => d.building))].sort((a, b) =>
        (parseInt(a.replace(/[^0-9]/g, '')) || 999) - (parseInt(b.replace(/[^0-9]/g, '')) || 999));

    const AXIS = { axisLine: { lineStyle: { color: 'rgba(0,200,255,0.3)' } }, axisLabel: { color: '#9fb4dd', fontSize: 11 }, splitLine: { lineStyle: { color: 'rgba(0,200,255,0.08)' } } };
    const C = { sold: '#4ade80', sub: '#ffb347', unsold: '#5b6b8c', cyan: '#00c8ff', purple: '#7b68ee', red: '#ff5d7a' };
    const tooltip = { trigger: 'axis', backgroundColor: 'rgba(8,14,32,0.95)', borderColor: 'rgba(0,200,255,0.4)', textStyle: { color: '#dfe8ff', fontSize: 12 } };

    function mk(el, opt) {
        const chart = echarts.init(document.getElementById(el));
        chart.setOption(opt);
        return chart;
    }

    // 1. 各楼栋堆叠柱状图
    (function () {
        const names = buildings.map(BNAME);
        const t = [], s = [], u = [];
        buildings.forEach(b => {
            const bs = data.filter(d => d.building === b);
            t.push(bs.length);
            s.push(bs.filter(isSold).length);
            u.push(bs.filter(isSub).length);
        });
        mk('cBuildings', {
            tooltip: Object.assign({}, tooltip, { axisPointer: { type: 'shadow' } }),
            legend: { data: ['待售', '认购', '已网签'], textStyle: { color: '#9fb4dd', fontSize: 11 }, top: 0 },
            grid: { left: 44, right: 12, top: 30, bottom: 60 },
            xAxis: Object.assign({}, AXIS, { type: 'category', data: names, axisLabel: { color: '#9fb4dd', fontSize: 10, rotate: 45 } }),
            yAxis: Object.assign({}, AXIS, { type: 'value', name: '套数', nameTextStyle: { color: '#5f6d96' } }),
            series: [
                { name: '待售', type: 'bar', stack: 'a', data: t.map((v, i) => v - s[i] - u[i]), itemStyle: { color: C.unsold } },
                { name: '认购', type: 'bar', stack: 'a', data: u, itemStyle: { color: C.sub } },
                { name: '已网签', type: 'bar', stack: 'a', data: s, itemStyle: { color: C.sold } },
            ]
        });
    })();

    // 2. 各楼栋去化率
    (function () {
        const names = buildings.map(BNAME);
        const rates = buildings.map(b => {
            const bs = data.filter(d => d.building === b);
            return bs.length ? +(bs.filter(isSold).length / bs.length * 100).toFixed(1) : 0;
        });
        mk('cRate', {
            tooltip: Object.assign({}, tooltip, { formatter: p => `${p.name}<br>去化率: <b style="color:#4ade80">${p.value}%</b>` }),
            grid: { left: 44, right: 12, top: 16, bottom: 60 },
            xAxis: Object.assign({}, AXIS, { type: 'category', data: names, axisLabel: { color: '#9fb4dd', fontSize: 10, rotate: 45 } }),
            yAxis: Object.assign({}, AXIS, { type: 'value', max: 100, name: '%', nameTextStyle: { color: '#5f6d96' } }),
            series: [{
                name: '去化率', type: 'bar', data: rates,
                itemStyle: { color: p => p.value >= 50 ? '#4ade80' : p.value >= 25 ? '#7fd8ff' : '#5b6b8c', borderRadius: [3, 3, 0, 0] },
                label: { show: true, position: 'top', color: '#9fb4dd', fontSize: 10, formatter: '{c}%' }
            }]
        });
    })();

    // 3. 整体去化环形图
    mk('cPie', {
        tooltip: { trigger: 'item', backgroundColor: 'rgba(8,14,32,0.95)', borderColor: 'rgba(0,200,255,0.4)', textStyle: { color: '#dfe8ff' } },
        legend: { bottom: 0, textStyle: { color: '#9fb4dd', fontSize: 11 } },
        series: [{
            type: 'pie', radius: ['45%', '72%'], center: ['50%', '44%'],
            itemStyle: { borderColor: '#0d1730', borderWidth: 3 },
            label: { color: '#9fb4dd', fontSize: 11, formatter: '{b}\n{c}套 ({d}%)' },
            data: [
                { name: '已网签', value: sold, itemStyle: { color: C.sold } },
                { name: '认购', value: sub, itemStyle: { color: C.sub } },
                { name: '待售', value: unsold, itemStyle: { color: C.unsold } },
            ]
        }]
    });

    // 4. 日期网签趋势 (按月)
    (function () {
        const monthMap = {};
        data.filter(isSold).forEach(d => {
            if (!d.signDate) return;
            const m = d.signDate.slice(0, 7);
            monthMap[m] = (monthMap[m] || 0) + 1;
        });
        const months = Object.keys(monthMap).sort();
        const cnt = months.map(m => monthMap[m]);
        const cum = []; let acc = 0;
        cnt.forEach(v => { acc += v; cum.push(acc); });
        mk('cTrend', {
            tooltip: Object.assign({}, tooltip, { trigger: 'axis' }),
            legend: { data: ['当月网签', '累计网签'], textStyle: { color: '#9fb4dd', fontSize: 11 }, top: 0 },
            grid: { left: 44, right: 16, top: 30, bottom: 40 },
            xAxis: Object.assign({}, AXIS, { type: 'category', data: months, axisLabel: { color: '#9fb4dd', fontSize: 10 } }),
            yAxis: Object.assign({}, AXIS, { type: 'value', name: '套', nameTextStyle: { color: '#5f6d96' } }),
            series: [
                { name: '当月网签', type: 'bar', data: cnt, itemStyle: { color: C.cyan, borderRadius: [3, 3, 0, 0] }, barMaxWidth: 22 },
                { name: '累计网签', type: 'line', data: cum, smooth: true, symbolSize: 6, lineStyle: { color: C.sold, width: 3 }, itemStyle: { color: C.sold }, areaStyle: { color: 'rgba(74,222,128,0.12)' } },
            ]
        });
    })();

    // 5. 户型分布与去化
    (function () {
        const lMap = {};
        data.forEach(d => { const k = d.layout || '-㎡'; (lMap[k] = lMap[k] || { t: 0, s: 0 }).t++; if (isSold(d)) lMap[k].s++; });
        const keys = Object.keys(lMap).sort((a, b) => (parseInt(a) || 0) - (parseInt(b) || 0));
        mk('cLayout', {
            tooltip: Object.assign({}, tooltip, { axisPointer: { type: 'shadow' } }),
            legend: { data: ['总套数', '已网签'], textStyle: { color: '#9fb4dd', fontSize: 11 }, top: 0 },
            grid: { left: 44, right: 12, top: 30, bottom: 40 },
            xAxis: Object.assign({}, AXIS, { type: 'category', data: keys }),
            yAxis: Object.assign({}, AXIS, { type: 'value', name: '套', nameTextStyle: { color: '#5f6d96' } }),
            series: [
                { name: '总套数', type: 'bar', data: keys.map(k => lMap[k].t), itemStyle: { color: C.purple, opacity: 0.7 } },
                { name: '已网签', type: 'bar', data: keys.map(k => lMap[k].s), itemStyle: { color: C.sold } },
            ]
        });
    })();

    // 6. 面积段分布
    (function () {
        const segs = [[0, 150, '<150'], [150, 180, '150-180'], [180, 200, '180-200'], [200, 250, '200-250'], [250, 300, '250-300'], [300, 9999, '300+']];
        const cnt = segs.map(() => 0), sc = segs.map(() => 0);
        data.forEach(d => {
            const a = d.area || 0;
            const i = segs.findIndex(s => a >= s[0] && a < s[1]);
            if (i >= 0) { cnt[i]++; if (isSold(d)) sc[i]++; }
        });
        mk('cArea', {
            tooltip: Object.assign({}, tooltip, { axisPointer: { type: 'shadow' } }),
            legend: { data: ['总套数', '已网签'], textStyle: { color: '#9fb4dd', fontSize: 11 }, top: 0 },
            grid: { left: 44, right: 12, top: 30, bottom: 40 },
            xAxis: Object.assign({}, AXIS, { type: 'category', data: segs.map(s => s[2] + '㎡') }),
            yAxis: Object.assign({}, AXIS, { type: 'value', name: '套', nameTextStyle: { color: '#5f6d96' } }),
            series: [
                { name: '总套数', type: 'bar', data: cnt, itemStyle: { color: C.cyan, opacity: 0.75 } },
                { name: '已网签', type: 'bar', data: sc, itemStyle: { color: C.sold } },
            ]
        });
    })();

    // 7. 单价区间分布
    (function () {
        const segs = [[0, 7000, '<7000'], [7000, 8000, '7-8k'], [8000, 9000, '8-9k'], [9000, 10000, '9-10k'], [10000, 12000, '10-12k'], [12000, 99999, '12k+']];
        const cnt = segs.map(() => 0);
        data.forEach(d => {
            const p = d.price || 0;
            const i = segs.findIndex(s => p >= s[0] && p < s[1]);
            if (i >= 0) cnt[i]++;
        });
        mk('cPrice', {
            tooltip: Object.assign({}, tooltip, { axisPointer: { type: 'shadow' } }),
            grid: { left: 44, right: 12, top: 20, bottom: 40 },
            xAxis: Object.assign({}, AXIS, { type: 'category', data: segs.map(s => s[2] + '元/㎡') }),
            yAxis: Object.assign({}, AXIS, { type: 'value', name: '套', nameTextStyle: { color: '#5f6d96' } }),
            series: [{ type: 'bar', data: cnt, itemStyle: { color: p => p.color || C.purple, borderRadius: [3, 3, 0, 0] }, barMaxWidth: 30 }]
        });
    })();

    // 8. 各楼栋成交均价 (dealPrice>0)
    (function () {
        const names = [], avgs = [];
        buildings.forEach(b => {
            const deals = data.filter(d => d.building === b && isSold(d) && d.dealPrice > 0);
            if (!deals.length) return;
            names.push(BNAME(b));
            avgs.push(Math.round(deals.reduce((a, d) => a + d.dealPrice, 0) / deals.length));
        });
        mk('cDeal', {
            tooltip: Object.assign({}, tooltip, { trigger: 'axis', formatter: p => `${p[0].name}<br>成交均价: <b style="color:#ffd77a">${p[0].value.toLocaleString()} 元/㎡</b>` }),
            grid: { left: 60, right: 40, top: 16, bottom: 40 },
            xAxis: Object.assign({}, AXIS, { type: 'value', name: '元/㎡', nameTextStyle: { color: '#5f6d96' } }),
            yAxis: Object.assign({}, AXIS, { type: 'category', data: names, axisLabel: { color: '#9fb4dd', fontSize: 10 } }),
            series: [{
                type: 'bar', data: avgs, barMaxWidth: 16,
                itemStyle: { color: p => p.value >= 9000 ? C.sold : p.value >= 8000 ? '#7fd8ff' : C.sub, borderRadius: [0, 3, 3, 0] },
                label: { show: true, position: 'right', color: '#9fb4dd', fontSize: 10, formatter: '{c}' }
            }]
        });
    })();

    // 最近网签表
    (function () {
        const recent = data.filter(isSold).filter(d => d.signDate).sort((a, b) => b.signDate.localeCompare(a.signDate)).slice(0, 12);
        const tb = document.querySelector('#tRecent tbody');
        tb.innerHTML = recent.map(d => `<tr>
            <td>${d.signDate}</td><td>${BNAME(d.building)}</td><td>${d.room}</td><td>${d.customer}</td>
            <td>${(d.dealTotal || d.total || 0).toLocaleString()}</td></tr>`).join('');
    })();

    // 认购表
    (function () {
        const subs = data.filter(isSub).sort((a, b) => (b.total || 0) - (a.total || 0)).slice(0, 12);
        const tb = document.querySelector('#tSub tbody');
        tb.innerHTML = subs.map(d => `<tr>
            <td>${BNAME(d.building)}</td><td>${d.room}</td><td>${d.layout || '-'}</td><td>${d.customer}</td>
            <td>${(d.total || 0).toLocaleString()}</td></tr>`).join('');
    })();

    window.addEventListener('resize', () => {
        document.querySelectorAll('.chart').forEach(el => {
            const c = echarts.getInstanceByDom(el);
            if (c) c.resize();
        });
    });

    // 数据管理页保存后 (localStorage 变化), 本看板自动刷新同步最新数据
    window.addEventListener('storage', e => {
        if (e.key === 'loupan_units_v1' || e.key === null) {
            location.reload();
        }
    });
</script>
    <script src="js/fullscreen.js"></script>
</body>
</html>
