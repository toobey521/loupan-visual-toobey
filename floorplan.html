    transition:all 0.25s;overflow:hidden;
    background:rgba(8,30,60,0.78);

    color:#fff;

    backdrop-filter:blur(2px);
    animation:hsPulse 2.2s ease-in-out infinite;
    z-index:5;
  }
  @keyframes hsPulse{
    0%,100%{box-shadow:0 0 6px rgba(0,200,255,0.25), inset 0 0 6px rgba(0,200,255,0.1);}
    50%{box-shadow:0 0 16px rgba(0,200,255,0.6), inset 0 0 10px rgba(0,200,255,0.2);}
  }
  .hs.res{border-color:rgba(0,200,255,0.75);}
  .hs.shop{border-color:rgba(255,180,60,0.8);background:rgba(80,50,10,0.78);box-shadow:0 0 8px rgba(255,180,60,0.35), inset 0 0 6px rgba(255,180,60,0.12);}
  .hs:hover{background:rgba(0,140,220,0.9) !important;border-color:#4dd8ff !important;transform:scale(1.12);z-index:20;box-shadow:0 0 20px rgba(0,200,255,0.8);animation:none;}
  .hs-label{
    font-size:11px;font-weight:700;color:#fff;
    text-align:center;line-height:1.2;
    text-shadow:0 1px 2px rgba(0,0,0,0.8);
    pointer-events:none;white-space:nowrap;
  }

  .hs:hover .hs-label{background:rgba(0,140,220,0.85);}
  .tip{text-align:center;color:rgba(255,255,255,0.5);font-size:12px;padding:12px;}

<script>
    // 热点网格轨道匹配: 预定义不重叠网格点, 按作者坐标就近匹配, 冲突顺延
    (function () {
        const hs = document.querySelectorAll('.hs');
        const items = [];
        hs.forEach(el => {
            const s = el.style;
            const x = parseFloat(s.left), y = parseFloat(s.top);
            const w = el.classList.contains('shop') ? 5.2 : 5.6;
            const h = el.classList.contains('shop') ? 6 : 7.5;
            items.push({ el, x, y, w, h });
        });
        const gridX = [4, 11, 18, 25, 32, 39, 46, 53, 60];
        const gridY = [3, 13, 23, 33, 43];
        const slots = [];
        for (const gy of gridY) for (const gx of gridX) slots.push({ x: gx, y: gy, used: false });
        items.sort((a, b) => (a.y - b.y) || (a.x - b.x));
        items.forEach(it => {
            const free = slots.filter(s => !s.used);
            free.sort((p, q) =>
                ((p.x - it.x) ** 2 + (p.y - it.y) ** 2) - ((q.x - it.x) ** 2 + (q.y - it.y) ** 2));
            const slot = free[0];
            slot.used = true;
            it.el.style.left = slot.x + '%';
            it.el.style.top = slot.y + '%';
            it.el.style.width = it.w + '%';
            it.el.style.height = it.h + '%';
        });
    })();
</script>
